<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D Bonfim Transportes · Em manutenção</title>
<meta name="description" content="Nossa plataforma está em manutenção programada. Em breve estaremos de volta.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#d80018">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,600;0,700;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#d80018;
    --red-deep:#a3000f;
    --red-dark:#7a000c;
    --ink:#171717;
    --paper:#ffffff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Archivo',system-ui,sans-serif;
    background:
      radial-gradient(120% 90% at 50% -10%, var(--red) 0%, var(--red-deep) 58%, var(--red-dark) 100%);
    color:var(--paper);
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
  }

  /* faixa de movimento (swoosh abstrato) — sutil, diagonal */
  .streaks{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .streaks span{
    position:absolute;
    left:-30%;
    width:160%;
    height:2px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.20),transparent);
    transform:rotate(-8deg);
    animation:slide 9s linear infinite;
  }
  .streaks span:nth-child(1){top:18%;animation-delay:0s;opacity:.5}
  .streaks span:nth-child(2){top:46%;animation-delay:3s;height:1px;opacity:.35}
  .streaks span:nth-child(3){top:74%;animation-delay:6s;opacity:.45}
  @keyframes slide{
    0%{transform:translateX(-18%) rotate(-8deg)}
    100%{transform:translateX(18%) rotate(-8deg)}
  }

  /* barra superior de status */
  .topbar{
    position:relative;z-index:2;
    display:flex;align-items:center;justify-content:space-between;
    padding:22px clamp(20px,5vw,56px);
    font-size:13px;letter-spacing:.08em;text-transform:uppercase;
    color:rgba(255,255,255,.85);
  }
  .mail-link{
    display:inline-flex;align-items:center;gap:8px;
    padding:7px 14px;border-radius:9px;
    font-size:13px;font-weight:600;letter-spacing:.02em;
    text-transform:none;
    color:rgba(255,255,255,.82);
    border:1px solid rgba(255,255,255,.18);
    background:rgba(0,0,0,.16);
    text-decoration:none;
    transition:color .2s,border-color .2s,background .2s;
  }
  .mail-link svg{width:14px;height:14px;stroke:#ffd23f;flex:none}
  .mail-link:hover{
    color:#fff;
    border-color:rgba(255,255,255,.38);
    background:rgba(0,0,0,.28);
  }
  .topbar .ref{opacity:.6;font-variant-numeric:tabular-nums}

  /* conteúdo central */
  main{
    position:relative;z-index:1;
    flex:1;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    text-align:center;
    padding:12px clamp(20px,6vw,40px) 40px;
  }
  .logo{
    width:min(560px,86vw);
    height:auto;
    display:block;
    margin:0 auto clamp(30px,6vh,52px);
    filter:drop-shadow(0 10px 30px rgba(0,0,0,.35));
  }
  h1{
    font-style:italic;font-weight:900;
    font-size:clamp(2rem,6vw,3.6rem);
    letter-spacing:.01em;line-height:1.05;
    text-transform:uppercase;
  }
  .sub{
    margin-top:16px;
    font-size:clamp(1rem,2.2vw,1.15rem);
    font-weight:500;
    color:rgba(255,255,255,.88);
    max-width:44ch;
    line-height:1.6;
  }

  /* painel de progresso */
  .panel{
    margin-top:clamp(28px,5vh,44px);
    width:min(420px,100%);
    background:rgba(0,0,0,.20);
    border:1px solid rgba(255,255,255,.16);
    border-radius:14px;
    padding:20px 24px;
    backdrop-filter:blur(6px);
  }
  .panel .row{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:13px;letter-spacing:.06em;text-transform:uppercase;
    color:rgba(255,255,255,.8);
  }
  .panel .pct{font-weight:700;font-size:15px;color:#fff;font-variant-numeric:tabular-nums}
  .bar{
    margin-top:12px;
    height:8px;border-radius:999px;
    background:rgba(255,255,255,.14);
    overflow:hidden;
  }
  .bar i{
    display:block;height:100%;width:0%;
    border-radius:999px;
    background:linear-gradient(90deg,#ffd23f,#fff);
    transition:width .9s ease;
  }

  /* rodape */
  footer{
    position:relative;z-index:1;
    display:flex;justify-content:space-between;align-items:center;gap:16px;
    padding:18px clamp(20px,5vw,56px) 22px;
    font-size:12.5px;
    color:rgba(255,255,255,.62);
    letter-spacing:.03em;
  }
  footer .copy{margin-left:auto}
  footer a{
    color:rgba(255,255,255,.92);
    font-weight:700;
    text-decoration:none;
    border-bottom:1px solid rgba(255,255,255,.35);
    padding-bottom:1px;
    transition:border-color .2s ease, color .2s ease;
  }
  footer a:hover{color:#fff;border-bottom-color:rgba(255,255,255,.85)}

  @media (prefers-reduced-motion: reduce){
    .streaks span{animation:none}
    .bar i{animation:none;width:68%}
  }
</style>
</head>
<body>

  <div class="streaks" aria-hidden="true"><span></span><span></span><span></span></div>

  <div class="topbar">
    <a class="mail-link" href="https://titan.hostgator.com.br/login/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      Acesso ao Webmail
    </a>
    <span class="ref">dbonfimtransportes.com</span>
  </div>

  <main>
    <img class="logo" src="logo-clean-lg.jpg" alt="D Bonfim Transportes" width="1400" height="390">

    <h1>Estamos em manutenção</h1>
    <p class="sub">
      Nosso site está passando por melhorias para te atender melhor.
      Em breve retornamos ao ar. Agradecemos a sua paciência.
    </p>

    <div class="panel" role="status" aria-live="polite">
      <div class="row"><span>Atualizando sistemas</span><span class="pct">68%</span></div>
      <div class="bar"><i aria-hidden="true"></i></div>
    </div>
  </main>

  <footer>
    <span class="copy">© 2026 <a href="https://leonildomilu.github.io/technetworkpi/" target="_blank" rel="noopener">Tech Network</a>. Todos os direitos reservados.</span>
  </footer>

  <script>
    // Barra: entra em 68%, depois sobe 1% a cada 10s ate 78% e permanece
    (function () {
      var pct = document.querySelector('.pct');
      var fill = document.querySelector('.bar i');
      var target = 78;

      function setPct(v){
        fill.style.width = v + '%';
        pct.textContent = v + '%';
      }

      // animacao inicial 0 -> 68
      var start = 68;
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){ setPct(start); });
      });

      // 69, 70, ... 78 — 1% a cada 10s
      setTimeout(function(){
        var cur = start;
        var t = setInterval(function(){
          if (cur < target){
            cur++;
            setPct(cur);
          } else {
            clearInterval(t);
          }
        }, 10000);
      }, 3000);
    })();
  </script>

</body>
</html>
